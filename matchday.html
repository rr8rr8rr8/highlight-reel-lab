<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matchday — Highlight Reel lab</title>
<link rel="stylesheet" href="lib.css">
<style>
  main { max-width: 860px; margin: 0 auto; padding: 56px 16px 60px; }
  h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -.02em; }
  .sub { color: var(--muted); margin: 0 0 8px; font-size: 14px; }
  section { margin-top: 28px; }
  .sechead { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
  .sechead h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .1em; margin: 0; }
  .sechead span { color: var(--dim); font-size: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
  .card { padding: 3px; border-radius: 17px; background: var(--accent); text-align: left; display: block; width: 100%; }
  .card.seen { background: #444; }
  .card:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  .cover { position: relative; aspect-ratio: 9 / 14; border-radius: 14px; overflow: hidden; border: 2px solid var(--bg);
    background: #1b1b1b center / cover no-repeat; }
  .card.seen .cover { filter: saturate(.5) brightness(.75); }
  .cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.88), rgba(0,0,0,0) 58%); }
  .cover .txt { position: absolute; left: 9px; right: 9px; bottom: 8px; z-index: 1; }
  .cover b { display: block; font-size: 13px; line-height: 1.2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .cover small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
  .cover .fl { position: absolute; top: 7px; left: 8px; z-index: 1; font-size: 15px; }
  .cover .new { position: absolute; top: 8px; right: 8px; z-index: 1; background: var(--accent); border-radius: 999px;
    font-size: 10px; font-weight: 700; padding: 2px 6px; }
  .state { color: var(--muted); padding: 40px 0; }

  #viewer { position: fixed; inset: 0; z-index: 100; background: #000; display: none; align-items: center; justify-content: center; }
  #viewer.open { display: flex; }
  #stage { position: relative; height: min(100vh, calc(100vw * 16 / 9)); height: min(100dvh, calc(100vw * 16 / 9));
    aspect-ratio: 9 / 16; background: #111 center / cover no-repeat; overflow: hidden; }
  @media (min-width: 620px) { #stage { border-radius: 14px; height: min(calc(100dvh - 24px), calc(100vw * 16 / 9)); } }
  #yt { position: absolute; inset: 0; }
  .tap { position: absolute; top: 0; bottom: 0; width: 50%; z-index: 2; background: transparent; padding: 0; -webkit-tap-highlight-color: transparent; }
  #tapL { left: 0; } #tapR { right: 0; }
  #top { position: absolute; left: 0; right: 0; top: 0; z-index: 3; padding: 10px 10px 26px; pointer-events: none;
    background: linear-gradient(to bottom, rgba(0,0,0,.7), rgba(0,0,0,0)); }
  #bars { display: flex; gap: 3px; }
  #bars i { flex: 1; height: 3px; border-radius: 2px; background: rgba(255,255,255,.3); overflow: hidden; }
  #bars i u { display: block; height: 100%; width: 0; background: #fff; }
  #head { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  #head .who { flex: 1; min-width: 0; }
  #head .who b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #head .who small { color: var(--muted); font-size: 11px; }
  #head button { pointer-events: auto; width: 34px; height: 34px; border-radius: 50%; background: rgba(0,0,0,.5); font-size: 15px; flex: none; }
  #bottom { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; padding: 40px 14px 18px; pointer-events: none;
    background: linear-gradient(to top, rgba(0,0,0,.85), rgba(0,0,0,0)); }
  #score { display: none; background: rgba(0,0,0,.65); border: 1px solid rgba(255,255,255,.25); border-radius: 8px; padding: 4px 9px;
    font-size: 12px; font-weight: 700; margin-bottom: 8px; width: fit-content; max-width: 100%; }
  #score em { font-style: normal; color: var(--good); padding: 0 5px; }
  #title { font-size: 15px; font-weight: 600; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
  #meta { color: var(--muted); font-size: 12px; margin-top: 5px; }
</style>
</head>
<body>
<a class="back" href="index.html">← Lab</a>

<main>
  <h1>Matchday</h1>
  <p class="sub">Clips grouped by league, team and player. Each story plays its 12 newest clips. A red ring means there are clips you have not seen.</p>
  <div id="home"><p class="state">Loading the feed.</p></div>
</main>

<div id="viewer" aria-hidden="true">
  <div id="stage">
    <div id="yt"></div>
    <button class="tap" id="tapL" aria-label="Previous clip"></button>
    <button class="tap" id="tapR" aria-label="Next clip"></button>
    <div id="top">
      <div id="bars"></div>
      <div id="head">
        <div class="who"><b id="sname"></b><small id="skind"></small></div>
        <button id="snd" aria-label="Sound">🔊</button>
        <button id="close" aria-label="Close">✕</button>
      </div>
    </div>
    <div id="bottom">
      <div id="score"></div>
      <div id="title"></div>
      <div id="meta"></div>
    </div>
  </div>
</div>

<script src="lib.js"></script>
<script>
(function () {
  const MAX_CLIPS = 12, MAX_CARDS = 30, KEY = 'matchday.seen.v1';
  const $ = id => document.getElementById(id);
  const esc = Reel.esc;

  // ---- seen store ----
  let seen = new Set();
  try { seen = new Set(JSON.parse(localStorage.getItem(KEY) || '[]')); } catch (e) {}
  function markSeen(id) {
    if (seen.has(id)) return;
    seen.add(id);
    try { localStorage.setItem(KEY, JSON.stringify([...seen].slice(-3000))); } catch (e) {}
  }

  // ---- build stories ----
  const SECTIONS = [
    { key: 'leagues', label: 'Leagues', min: 3, names: v => (v.ctx && v.ctx.league ? [v.ctx.league] : []) },
    { key: 'teams', label: 'Teams', min: 3, names: v => ((v.ctx && v.ctx.teams) || []).map(t => t && t.name) },
    { key: 'players', label: 'Players', min: 2, names: v => ((v.ctx && v.ctx.players) || []).map(p => p && p.name) },
  ];
  let sections = [];

  function build(items) {
    return SECTIONS.map(def => {
      const map = new Map();
      for (const v of items) {
        for (const name of new Set(def.names(v).filter(Boolean))) {
          if (!map.has(name)) map.set(name, []);
          const arr = map.get(name);
          if (!arr.some(x => x.id === v.id)) arr.push(v);
        }
      }
      const used = new Set();
      const stories = [...map.entries()].filter(([, arr]) => arr.length >= def.min)
        .sort((a, b) => b[1].length - a[1].length || a[0].localeCompare(b[0]))
        .slice(0, MAX_CARDS)
        .map(([name, arr]) => {
          // items arrive newest first: keep the newest MAX_CLIPS, play them oldest to newest
          const clips = arr.slice(0, MAX_CLIPS).reverse();
          const cover = arr.find(v => !used.has(v.id)) || arr[0];
          used.add(cover.id);
          return { name, kind: def.label, total: arr.length, clips, cover };
        });
      return { key: def.key, label: def.label, stories };
    });
  }

  const unseenCount = s => s.clips.filter(c => !seen.has(c.id)).length;

  function setCover(el, id) {
    el.style.backgroundImage = 'url("' + Reel.thumb(id) + '")';
    const img = new Image();
    // oar2 answers with a small landscape placeholder when no tall thumbnail exists
    img.onload = () => { if (img.naturalHeight > img.naturalWidth) el.style.backgroundImage = 'url("' + Reel.tall(id) + '"), url("' + Reel.thumb(id) + '")'; };
    img.src = Reel.tall(id);
  }

  function renderHome() {
    const home = $('home');
    if (!sections.some(s => s.stories.length)) { home.innerHTML = '<p class="state">No stories yet. The feed has too few tagged clips.</p>'; return; }
    home.innerHTML = sections.filter(s => s.stories.length).map(s =>
      '<section><div class="sechead"><h2>' + s.label + '</h2><span>' + s.stories.length + ' stories</span></div><div class="grid">' +
      s.stories.map((st, i) => {
        const un = unseenCount(st);
        return '<button class="card' + (un ? '' : ' seen') + '" data-sec="' + s.key + '" data-i="' + i + '">' +
          '<div class="cover" data-cover="' + esc(st.cover.id) + '">' +
          '<span class="fl">' + Reel.flag(st.cover.country) + '</span>' +
          (un ? '<span class="new">' + un + ' new</span>' : '') +
          '<div class="txt"><b>' + esc(st.name) + '</b><small>' + st.total + ' clips</small></div></div></button>';
      }).join('') + '</div></section>').join('');
    home.querySelectorAll('[data-cover]').forEach(el => setCover(el, el.dataset.cover));
  }

  $('home').addEventListener('click', e => {
    const c = e.target.closest('.card');
    if (!c) return;
    const sec = sections.find(s => s.key === c.dataset.sec);
    openStory(sec, +c.dataset.i);
  });

  // ---- viewer ----
  let cur = null;        // { sec, si, ci }
  let player = null, token = 0, poll = null, startedAt = 0, kicked = false;
  let soundOn = true;

  function killPlayer() {
    token++;
    clearInterval(poll); poll = null;
    if (player) { try { player.destroy(); } catch (e) {} player = null; }
    $('yt').innerHTML = '';
  }

  function openStory(sec, si) {
    const st = sec.stories[si];
    let ci = st.clips.findIndex(c => !seen.has(c.id));
    if (ci < 0) ci = 0;
    cur = { sec, si, ci };
    $('viewer').classList.add('open');
    $('viewer').setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    drawStory();
    show();
  }

  function closeViewer() {
    killPlayer();
    cur = null;
    $('viewer').classList.remove('open');
    $('viewer').setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    renderHome();
  }

  function drawStory() {
    const st = cur.sec.stories[cur.si];
    $('sname').textContent = st.name;
    $('skind').textContent = st.kind.replace(/s$/, '') + ' · story ' + (cur.si + 1) + ' of ' + cur.sec.stories.length;
    $('bars').innerHTML = st.clips.map(() => '<i><u></u></i>').join('');
  }

  function setBars(frac) {
    const us = $('bars').querySelectorAll('u');
    us.forEach((u, i) => { u.style.width = (i < cur.ci ? 100 : i === cur.ci ? Math.round(frac * 1000) / 10 : 0) + '%'; });
  }

  function show() {
    killPlayer();
    const my = token;
    const st = cur.sec.stories[cur.si], v = st.clips[cur.ci];
    markSeen(v.id);
    setBars(0);
    $('stage').style.backgroundImage = 'url("' + Reel.thumb(v.id) + '")';
    $('title').textContent = v.title || '';
    $('meta').textContent = Reel.flag(v.country) + ' ' + (v.channel || '') + ' · ' + Reel.ago(v.published) + ' ago';
    const sc = v.ctx && v.ctx.score, chip = $('score');
    if (sc && sc.home && sc.away && sc.h != null && sc.a != null) {
      chip.innerHTML = esc(sc.home) + '<em>' + esc(sc.h) + '–' + esc(sc.a) + '</em>' + esc(sc.away);
      chip.style.display = 'block';
    } else chip.style.display = 'none';

    startedAt = Date.now(); kicked = false;
    Reel.player($('yt'), v.id, {
      muted: true, autoplay: true,
      onEnd: () => { if (my === token) next(); },
      onError: () => { if (my === token) next(); },
    }).then(p => {
      if (my !== token) { try { p.destroy(); } catch (e) {} return; }
      player = p;
      if (soundOn) { try { p.unMute(); p.setVolume(100); } catch (e) {} }
    }).catch(() => { if (my === token) next(); });

    poll = setInterval(() => {
      if (my !== token) return;
      const waited = Date.now() - startedAt;
      let state = -1, t = 0, d = 0;
      if (player && typeof player.getPlayerState === 'function') {
        try { state = player.getPlayerState(); t = player.getCurrentTime() || 0; d = player.getDuration() || 0; } catch (e) {}
      }
      if (d > 0) setBars(Math.min(1, t / d));
      if (t > 0.2) return;
      // Not moving after 3s: the browser probably blocked sound. Mute and try again.
      if (player && !kicked && waited > 3000 && state !== 1) {
        kicked = true;
        try { player.mute(); player.playVideo(); } catch (e) {}
      }
      // Still nothing after 10s: skip the clip.
      if (waited > 10000) next();
    }, 200);
  }

  function next() {
    if (!cur) return;
    const st = cur.sec.stories[cur.si];
    if (cur.ci < st.clips.length - 1) { cur.ci++; show(); return; }
    if (cur.si < cur.sec.stories.length - 1) { cur.si++; cur.ci = 0; drawStory(); show(); return; }
    closeViewer();
  }

  function prev() {
    if (!cur) return;
    if (cur.ci > 0) { cur.ci--; show(); return; }
    if (cur.si > 0) { cur.si--; cur.ci = 0; drawStory(); show(); return; }
    show();
  }

  $('tapR').addEventListener('click', next);
  $('tapL').addEventListener('click', prev);
  $('close').addEventListener('click', closeViewer);
  $('snd').addEventListener('click', () => {
    soundOn = !soundOn;
    $('snd').textContent = soundOn ? '🔊' : '🔇';
    if (player) { try { if (soundOn) { player.unMute(); player.setVolume(100); player.playVideo(); } else player.mute(); } catch (e) {} }
  });
  $('viewer').addEventListener('click', e => { if (e.target === $('viewer')) closeViewer(); });
  document.addEventListener('keydown', e => {
    if (!cur) return;
    if (e.key === 'Escape') closeViewer();
    else if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft') prev();
  });

  // ---- go ----
  Reel.load().then(items => { sections = build(items); renderHome(); })
    .catch(() => { $('home').innerHTML = '<p class="state">The feed did not load. Open this page from http://localhost:8522/lab/.</p>'; });
})();
</script>
</body>
</html>

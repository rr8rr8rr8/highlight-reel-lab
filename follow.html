<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Feed</title>
<link rel="stylesheet" href="lib.css">
<style>
  :root { --bar: 56px; }
  body { overflow: hidden; }
  [hidden] { display: none !important; }

  /* Step 1: pick */
  #pick { position: fixed; inset: 0; overflow-y: auto; padding: 56px 16px 110px; }
  #pick .wrap { max-width: 760px; margin: 0 auto; }
  #pick h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -.02em; }
  #pick p.sub { color: var(--muted); margin: 0 0 16px; }
  #q { width: 100%; background: var(--panel); border: 1px solid var(--line); color: var(--fg); border-radius: 12px;
    padding: 12px 14px; font: inherit; outline: none; }
  #q:focus { border-color: var(--muted); }
  .group h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin: 22px 0 10px; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips .pill { display: inline-flex; gap: 7px; align-items: center; }
  .chips .pill i { font-style: normal; font-size: 11px; opacity: .55; font-weight: 500; }
  .chips .none { color: var(--dim); font-size: 13px; }
  #foot { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(transparent, var(--bg) 35%); display: flex; justify-content: center; }
  #foot .in { width: 100%; max-width: 760px; display: flex; align-items: center; gap: 12px; justify-content: space-between;
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 10px 10px 10px 16px; }
  #foot span { color: var(--muted); font-size: 13px; }

  /* Step 2: feed */
  #bar { position: fixed; top: 0; left: 0; right: 0; height: var(--bar); z-index: 40; display: flex; align-items: center; gap: 8px;
    padding: 0 12px 0 84px; background: rgba(10,10,10,.85); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  #mine { flex: 1; min-width: 0; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; align-items: center; }
  #mine::-webkit-scrollbar { display: none; }
  #mine .pill { padding: 6px 11px; font-size: 12px; flex: none; }
  #mine .pill b { font-weight: 400; opacity: .5; margin-left: 5px; }
  #mine .empty { color: var(--dim); font-size: 13px; white-space: nowrap; }
  #edit { flex: none; padding: 7px 14px; font-size: 13px; }
  #feed { position: fixed; inset: var(--bar) 0 0 0; overflow-y: auto; scroll-snap-type: y mandatory; scrollbar-width: none; }
  #feed::-webkit-scrollbar { display: none; }
  .slide { height: 100%; scroll-snap-align: start; scroll-snap-stop: always; display: grid; place-items: center; padding: 10px 12px; }
  .slide .frame { width: min(100%, calc((100dvh - var(--bar) - 20px) * 9 / 16)); cursor: pointer; }
  .pl { position: absolute; inset: 0; opacity: 0; transition: opacity .25s; }
  .slide.playing .pl { opacity: 1; }
  .snd { position: absolute; top: 10px; right: 10px; z-index: 3; background: rgba(0,0,0,.55); border-radius: 999px; padding: 5px 10px;
    font-size: 11px; color: var(--muted); pointer-events: none; }
  .info { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; padding: 60px 14px 14px;
    background: linear-gradient(transparent, rgba(0,0,0,.88) 55%); pointer-events: none; }
  .why { font-size: 12px; font-weight: 600; color: var(--good); margin-bottom: 5px; }
  .why.also { color: var(--dim); }
  .ttl { font-weight: 600; font-size: 15px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fol { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; pointer-events: auto; }
  .fol button { background: rgba(255,255,255,.16); border-radius: 999px; padding: 6px 11px; font-size: 12px; backdrop-filter: blur(6px);
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fol button:hover { background: rgba(255,255,255,.3); }
  .fol button.on { background: var(--fg); color: #000; font-weight: 700; }
  #msg { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); padding: 24px; text-align: center; }
  @media (max-width: 480px) { #pick h1 { font-size: 22px; } #foot span { font-size: 12px; } }
</style>
</head>
<body>
<a class="back" href="index.html">← Lab</a>
<div id="msg">Loading today's clips.</div>

<main id="pick" hidden>
  <div class="wrap">
    <h1>Pick a few things you follow</h1>
    <p class="sub">These are the most common tags in today's feed. Your feed ranks clips that match.</p>
    <input id="q" type="search" placeholder="Search teams, players, leagues, countries" autocomplete="off">
    <div id="groups"></div>
  </div>
  <div id="foot"><div class="in"><span id="tally"></span><button class="btn" id="go">Show feed</button></div></div>
</main>

<div id="bar" hidden><div id="mine"></div><button class="pill" id="edit">Edit</button></div>
<div id="feed" hidden></div>

<script src="lib.js"></script>
<script>
(function () {
  const { esc, ago, flag } = Reel;
  const $ = id => document.getElementById(id);
  const TYPES = [['team', 'Teams'], ['player', 'Players'], ['league', 'Leagues'], ['country', 'Countries']];
  const WEIGHT = { player: 3, team: 3, league: 2, country: 1 };
  const KEY = 'lab.follow.v1', PAGE = 20;
  const feedEl = $('feed');

  let items = [], index = new Map(), follows = new Set();
  let order = [], rendered = 0, cur = -1, live = null, token = 0, muted = true, mountTimer = 0;

  try { follows = new Set(JSON.parse(localStorage.getItem(KEY) || '[]')); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify([...follows])); } catch (e) {} };
  const nameOf = k => k.slice(k.indexOf('|') + 1);
  const typeOf = k => k.slice(0, k.indexOf('|'));
  const label = k => (typeOf(k) === 'country' ? flag(nameOf(k)) + ' ' : '') + esc(nameOf(k));

  // Entities tagged on a clip, strongest first
  function ents(it) {
    if (it._e) return it._e;
    const c = it.ctx || {}, out = [], seen = new Set();
    const add = (t, n) => { if (!n) return; const k = t + '|' + n; if (seen.has(k)) return; seen.add(k); out.push({ t, n, k }); };
    (c.players || []).forEach(p => add('player', p && p.name));
    (c.teams || []).forEach(t => add('team', t && t.name));
    add('league', c.league);
    add('country', it.country);
    return (it._e = out);
  }

  function score(it) {
    const m = ents(it).filter(e => follows.has(e.k));
    const hours = Math.max(0, (Date.now() - new Date(it.published)) / 36e5) || 0;
    it._m = m;
    it._base = m.reduce((s, e) => s + WEIGHT[e.t], 0);
    it._rec = 0.9 / (1 + hours / 24);   // always under one point, so it only breaks ties
  }
  function rank(list) {
    return list.slice().sort((a, b) => (b._base > 0) - (a._base > 0) || (b._base + b._rec) - (a._base + a._rec));
  }

  /* ---------- Step 1 ---------- */
  function buildIndex() {
    index = new Map();
    for (const it of items) for (const e of ents(it)) {
      const r = index.get(e.k) || { k: e.k, t: e.t, n: e.n, c: 0 };
      r.c++; index.set(e.k, r);
    }
  }
  function renderPick() {
    const q = $('q').value.trim().toLowerCase();
    const all = [...index.values()].sort((a, b) => b.c - a.c || a.n.localeCompare(b.n));
    $('groups').innerHTML = TYPES.map(([t, title]) => {
      const mine = all.filter(r => r.t === t);
      let show = q ? mine.filter(r => r.n.toLowerCase().includes(q)).slice(0, 24) : mine.slice(0, 12);
      if (!q) show = show.concat(mine.slice(12).filter(r => follows.has(r.k)));
      const chips = show.map(r => `<button class="pill${follows.has(r.k) ? ' on' : ''}" data-k="${esc(r.k)}">${label(r.k)}<i>${r.c}</i></button>`).join('');
      return `<section class="group"><h2>${title}</h2><div class="chips">${chips || '<span class="none">No match.</span>'}</div></section>`;
    }).join('');
    const n = items.filter(it => ents(it).some(e => follows.has(e.k))).length;
    $('tally').textContent = follows.size
      ? `${follows.size} followed. ${n} of ${items.length} clips match.`
      : `${items.length} clips today. Nothing followed yet.`;
  }
  $('groups').addEventListener('click', e => {
    const b = e.target.closest('button[data-k]'); if (!b) return;
    const k = b.dataset.k;
    follows.has(k) ? follows.delete(k) : follows.add(k);
    save(); renderPick();
  });
  $('q').addEventListener('input', renderPick);
  $('go').addEventListener('click', () => showFeed());
  $('edit').addEventListener('click', showPick);

  function showPick() {
    teardown();
    $('feed').hidden = $('bar').hidden = true;
    $('pick').hidden = false;
    renderPick();
  }
  function showFeed() {
    $('pick').hidden = true;
    $('feed').hidden = $('bar').hidden = false;
    rerank(false);
  }

  /* ---------- Step 2 ---------- */
  function renderBar() {
    $('mine').innerHTML = follows.size
      ? [...follows].map(k => `<button class="pill" data-k="${esc(k)}" title="Remove">${label(k)}<b>×</b></button>`).join('')
      : '<span class="empty">You follow nothing yet. Tap + Follow on a clip.</span>';
  }
  $('mine').addEventListener('click', e => {
    const b = e.target.closest('button[data-k]'); if (!b) return;
    follows.delete(b.dataset.k); save(); rerank(true);
  });

  function infoHTML(it) {
    const m = it._m || [];
    const names = m.slice(0, 3).map(e => esc(e.n));
    const why = m.length
      ? `<div class="why">Because you follow ${names.length > 1 ? names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1] : names[0]}</div>`
      : `<div class="why also">${follows.size ? 'Also today' : 'Newest first. Follow a tag to rank your feed.'}</div>`;
    const rest = ents(it).filter(e => !follows.has(e.k)).slice(0, 5);
    const fol = rest.map(e => `<button data-k="${esc(e.k)}">+ Follow ${label(e.k)}</button>`).join('');
    return why + `<div class="ttl">${esc(it.title)}</div>` +
      `<div class="meta">${flag(it.country)} ${esc(it.country)} · ${esc(it.channel)} · ${ago(it.published)}</div>` +
      (fol ? `<div class="fol">${fol}</div>` : '');
  }
  function renderMore() {
    const end = Math.min(order.length, rendered + PAGE);
    for (let i = rendered; i < end; i++) {
      const it = order[i], s = document.createElement('section');
      s.className = 'slide'; s.dataset.i = i;
      s.innerHTML = `<div class="frame" style="background-image:url(${Reel.tall(it.id)}),url(${Reel.thumb(it.id)})">` +
        `<div class="pl"></div><div class="snd">${muted ? 'Tap for sound' : 'Sound on'}</div><div class="info">${infoHTML(it)}</div></div>`;
      feedEl.appendChild(s); io.observe(s);
    }
    rendered = end;
  }

  // keep=true: the clips already scrolled past (and the one playing) stay put; everything after is re-ranked.
  function rerank(keep) {
    items.forEach(score);
    const head = keep && cur >= 0 ? order.slice(0, cur + 1) : [];
    const inHead = new Set(head);
    order = head.concat(rank(items.filter(it => !inHead.has(it))));
    if (!head.length) {
      teardown(); io.disconnect(); feedEl.innerHTML = ''; rendered = 0; cur = -1; feedEl.scrollTop = 0;
    } else {
      [...feedEl.children].slice(head.length).forEach(n => { io.unobserve(n); n.remove(); });
      rendered = head.length;
      head.forEach((it, i) => { const el = feedEl.children[i].querySelector('.info'); if (el) el.innerHTML = infoHTML(it); });
    }
    renderMore(); renderBar();
  }

  function teardown() {
    token++; clearTimeout(mountTimer);
    if (live) { try { live.destroy(); } catch (e) {} live = null; }
    feedEl.querySelectorAll('.pl').forEach(el => { el.innerHTML = ''; });
    feedEl.querySelectorAll('.playing').forEach(el => el.classList.remove('playing'));
  }
  function mount(i) {
    const slide = feedEl.children[i], it = order[i];
    if (!slide || !it || feedEl.hidden) return;
    const el = slide.querySelector('.pl'), my = ++token;
    Reel.player(el, it.id, {
      muted, loop: true,
      onPlaying: () => { if (my === token) slide.classList.add('playing'); },
      onError: () => {
        if (my !== token) return;
        const w = slide.querySelector('.why'); if (w) { w.className = 'why also'; w.textContent = 'This clip cannot be played here.'; }
        go(1);
      },
    }).then(p => {
      if (my !== token) { try { p.destroy(); } catch (e) {} return; }
      live = p;
    });
  }
  function activate(i) {
    if (i === cur) return;
    cur = i; teardown();
    mountTimer = setTimeout(() => mount(i), 220);   // wait for the scroll to settle so only one player is built
    if (i >= rendered - 5) renderMore();
  }
  function go(d) {
    const n = feedEl.children[Math.max(0, cur) + d];
    if (n) n.scrollIntoView({ behavior: 'smooth' });
  }
  const io = new IntersectionObserver(es => {
    for (const e of es) if (e.isIntersecting && e.intersectionRatio >= 0.6) activate(+e.target.dataset.i);
  }, { root: feedEl, threshold: 0.6 });

  feedEl.addEventListener('click', e => {
    const b = e.target.closest('button[data-k]');
    if (b) { follows.add(b.dataset.k); save(); rerank(true); return; }
    if (!e.target.closest('.frame')) return;
    muted = !muted;
    if (live) { try { muted ? live.mute() : live.unMute(); live.playVideo(); } catch (err) {} }
    feedEl.querySelectorAll('.snd').forEach(s => { s.textContent = muted ? 'Sound off' : 'Sound on'; });
  });
  document.addEventListener('keydown', e => {
    if (feedEl.hidden || e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowDown' || e.key === 'j') { e.preventDefault(); go(1); }
    if (e.key === 'ArrowUp' || e.key === 'k') { e.preventDefault(); go(-1); }
  });

  Reel.load().then(list => {
    items = list || [];
    if (!items.length) { $('msg').textContent = 'No clips in the feed right now.'; return; }
    $('msg').hidden = true;
    buildIndex();
    // drop follows that no longer exist in today's feed? Keep them: they may match again tomorrow.
    follows.size ? showFeed() : showPick();
  }).catch(() => { $('msg').textContent = 'The feed did not load. Open this page from http://localhost:8522/lab/.'; });
})();
</script>
</body>
</html>
